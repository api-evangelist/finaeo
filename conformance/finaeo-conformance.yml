security_program:
  hosting: AWS (VPC, ECS on EC2, ELB, encrypted RDS in private subnets, multi-AZ)
  regions: [AWS Canada, 'AWS US (stated as "coming soon" in 2021")']
  encryption: databases encrypted at rest; backups encrypted in storage and transit;
    CloudWatch logs AES-256 in transit and at rest
  monitoring: [New Relic, AWS CloudWatch, AWS GuardDuty, AWS Shield, host-based IDS,
    file integrity monitoring]
  vulnerability_testing: monthly
  penetration_testing: annual, independent, manual
  dependency_scanning: third-party libraries scanned for outdated/insecure versions
  access_control: MFA + VPN allowlist to servers/databases; role-based least
    privilege; quarterly access reviews
  bcdr: business continuity and disaster recovery tested and reviewed annually;
    terraform + CI/CD redeploy; daily backups retained ≥7 days
  training: security and privacy training at onboarding and annually
  disclosure_program: none published — no security.txt, no security@ contact, no
    bug bounty, no responsible-disclosure page
