source: https://www.finaeo.com/security/
source_note: Finaeo Security Statement, last updated 2021-07-26. Live host returns
  HTTP 403 (Cloudflare bot challenge); content read in full via Internet Archive.
note: |
  Finaeo publishes no machine-readable API contract, so none of the API-level
  cross-cutting standards below can be asserted — they are recorded as
  not-conformed on the evidence of absence, not assumed. The one substantive
  standards surface Finaeo does publish is its Security Statement, which
  describes an internal security program (OWASP Top 10 testing, monthly
  vulnerability scanning, annual third-party penetration testing) and inherits
  data-centre certifications from AWS.

  IMPORTANT DISTINCTION, recorded because it is easy to misread: the certification
  list on that page (PCI DSS Level 1, ISO 27001, FISMA Moderate, FedRAMP, HIPAA,
  SOC 1 & SOC 2) is explicitly attributed to AWS as Finaeo's hosting provider —
  "AWS maintains annual certifications and 3rd party audit reports including..."
  Those are inherited infrastructure certifications, NOT Finaeo certifications.
  Finaeo's own SOC 2 is stated only as an intention: "Starting in 2022-Q1, Finaeo
  plans to complete SOC-2 security reviews for its platform, and intends to
  perform these annually on an ongoing basis." No completed Finaeo audit report,
  certificate, or trust portal was found, and the page has not been updated since
  2021-07-26. (The same paragraph also carries an uncorrected copy-paste error,
  describing how "Rock Content achieves key compliance controls" — a third-party
  template left in place.) Because no Finaeo-held certification is published,
  this repo emits no Compliance and no TrustCenter pointer.
