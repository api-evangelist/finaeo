  acord:
    posture: no ACORD reference found
    evidence: |
      Zero matches for ACORD, AL3, ACORD XML, NGDS, IVANS, agency download,
      Applied Epic, Vertafore or AMS360 across 2,840 unique archived first-party
      URLs and across the homepage, carrier, broker, distributor, partnership,
      security and Empire Life integration pages that were read in full. Finaeo
      is a life-side distribution platform, and the North American life channel
      sits outside the P&C ACORD/AL3/IVANS agency-download rails, so the absence
      is consistent with the segment — but it is an absence, and it is recorded
      as one. Data exchange with carriers is bilateral and proprietary.
  insuranceVerbs:
    quote:
      exposed: true
      surface: in-product only
      audience: agent-facing
      note: Quoting and multi-carrier product comparison are core marketplace
        features, available to logged-in brokers in the Finaeo UI. No API.
    bind:
      exposed: partial
      surface: in-product only
      audience: agent-facing
      note: '"Placing a Policy — start the checkout process on our platform," with
        the caveat printed on Finaeo''s own homepage: "* available with a limited
        selection of carriers." No API.'
    issue:
      exposed: false
      surface: none
      audience: n/a
      note: Issuance happens at the carrier. The Empire Life integration hands off
        into the carrier's own Fast & Full Life Application platform.
    fnol:
      exposed: false
      surface: none
      audience: n/a
      note: Finaeo is a distribution/agency platform; no claims or FNOL capability
        is offered or documented.
  authModel:
    scheme: username/password web login to a gated SaaS application
    apiAuth: none published — no API keys, no OAuth2 client-credentials, no OAuth2
      authorization-code, no mTLS, and no partner API auth documentation of any kind
    discoveryDocuments: none — /.well-known/openid-configuration and
      /.well-known/oauth-authorization-server are not served
  webhooks:
    exists: false
    note: No webhook documentation, no event catalog, no AsyncAPI. Absence recorded
      as a finding, not inferred.
  postman:
    exists: false
    note: No public Postman collection or workspace found.
  graphql:
    exists: false
    note: No GraphQL endpoint documented or discoverable.
  grpc:
    exists: false
    note: No published .proto files.
  sdks:
    exists: false
    note: |
      GitHub organization github.com/FinaeoInc exists (created 2016-05-19) with 3
      public repositories: gulp-cloudfront and angular-bootstrap-calendar (both
      forks of unrelated JS tooling, last touched 2016) and finaeo-codetest (an
      engineering hiring code test, last touched 2020-07-22). No SDK, no client
      library, no API definition. One npm package exists — finaeo-pattern-library —
      a CSS/HTML pattern library for the (now non-resolving) portal.finaeo.com.
  transports:
    - protocol: REST
      scheme: https
      documented: false
      note: No public REST API is documented. The platform is certainly REST-backed
        internally, but nothing is published, versioned or referenced.
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      documented: false
    - protocol: ACORD AL3 / ACORD XML
      documented: false
      note: No ACORD transport of any kind referenced.
    - protocol: Bilateral carrier integration
      documented: partially
      note: Empire Life "Fast & Full Life Application" data handoff, announced
        2021-05-18. Described in a press release; no technical specification,
        endpoint or schema published.
  companyProfile:
    legalName: Finaeo Inc.
    headquarters: Toronto, Ontario, Canada
    homeMarket: Canada
    secondaryMarket: United States (via IMO / broker-agency partnerships)
    segment: life insurance distribution — digital marketplace, broker CRM,
      white-label client portal
    isCarrier: false
    founders: Aly Dhalla (CEO / Co-Founder)
    funding: CAD $5.35M round led by Luge Capital (2019); an earlier CAD $2.25M
      round
    boardNote: Alister Campbell joined the Finaeo board of directors
    namedPartners:
      - Empire Life (carrier integration, 2021)
      - Brokers International (US IMO partnership)
      - APOLLO Insurance (partnership)
      - Willful (advisor partnership program)
    infrastructure: AWS (VPC, ECS on EC2, ELB, encrypted RDS in private subnets),
      per the published Security Statement last updated 2021-07-26
  marketContext: |
    Canada has the most fragmented insurance supervision of the four markets in
    this study: OSFI supervises federally-regulated insurers prudentially while the
    provinces regulate market conduct (FSRA in Ontario, AMF in Quebec). There is no
    open-insurance mandate, and Consumer-Driven Banking — Canada's open-banking
    framework — excludes insurance entirely. With no forcing function, a
    distribution-layer vendor like Finaeo has no regulatory reason to publish an
    API, and it does not. Its stated strategy is the opposite: sell carriers a
    no-code onboarding path so they never have to build one either.
